name: hc4rl
description: Low vision assistive tools suite — edge highlight, region zoom, face names.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  opencv_dart: ^2.1.0
  image: ^4.0.0
  path_provider: ^2.1.0
  path: ^1.8.0
  face_verification: ^0.3.3
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
